name: Publicar en Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Vincular proyecto de Expo
        run: eas init --non-interactive --force

      - name: Configurar actualizaciones
        run: |
          eas update:configure --platform all --non-interactive || true
          node scripts/eas-config.js

      - name: Publicar
        env:
          MENSAJE: ${{ github.event.head_commit.message || 'Publicación manual' }}
        run: eas update --channel main --platform all --non-interactive --message "$(echo "$MENSAJE" | head -n 1)"

      - name: Comprobar que Expo Go puede descargarla
        run: |
          for p in android ios; do
            echo "== $p (sin sesión)"
            curl -s -o manifest-$p.txt -w "HTTP %{http_code}\n" \
              -H "expo-platform: $p" -H "expo-runtime-version: exposdk:57.0.0" -H "expo-channel-name: main" \
              -H "accept: multipart/mixed,application/expo+json,application/json" \
              "https://u.expo.dev/3f182b83-9873-4a03-be84-6164264cc751"
            head -c 1200 manifest-$p.txt; echo
            url=$(grep -o '"launchAsset":{[^}]*"url":"[^"]*"' manifest-$p.txt | grep -o 'https[^"]*' | head -1)
            echo "bundle: $url"
            curl -s -w "\nbundle sin sesion HTTP %{http_code}\n" "$url" | tail -c 400
            curl -s -o /dev/null -w "bundle con sesion HTTP %{http_code} %{size_download} bytes\n" -H "Authorization: Bearer $EXPO_TOKEN" "$url"
          done
