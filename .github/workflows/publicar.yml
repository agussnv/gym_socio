name: Publicar en Expo Go

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      - name: Vincular proyecto de Expo
        run: eas init --non-interactive --force

      - name: Configurar actualizaciones
        run: |
          eas update:configure --platform all --non-interactive || true
          node scripts/eas-config.js

      - name: Publicar
        run: eas update --channel main --platform all --non-interactive --message "${{ github.event.head_commit.message || 'Publicación manual' }}"
